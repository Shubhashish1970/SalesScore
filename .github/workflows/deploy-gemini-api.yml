# Deploy Gemini commentary API to GCP Cloud Functions (Gen2) on push to main.
#
# Secrets: FIREBASE_SERVICE_ACCOUNT_JSON, GEMINI_API_KEY. Optional: FIREBASE_PROJECT_ID.
# The service account needs Cloud Functions Developer + Service Account User.
# Ensure Cloud Functions, Cloud Build, and Run APIs are enabled in the project
# (GCP Console → APIs & Services → Enable APIs) if this is the first deploy.

name: Deploy Gemini API (GCP)

on:
  push:
    branches: [main]
    paths:
      - "gcp-gemini-api/**"
      - ".github/workflows/deploy-gemini-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}

      - name: Deploy Cloud Function (Gemini commentary)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          PROJECT_ID="${PROJECT_ID:-salesscore-c34f3}"
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY not set; function will return 503 until key is set in GCP Console."
          fi
          gcloud functions deploy gemini-commentary \
            --gen2 \
            --runtime=nodejs20 \
            --region=us-central1 \
            --source=./gcp-gemini-api \
            --entry-point=geminiCommentary \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "GEMINI_API_KEY=$GEMINI_API_KEY" \
            --project="$PROJECT_ID" \
            --quiet
          echo "Function URL: https://us-central1-${PROJECT_ID}.cloudfunctions.net/gemini-commentary"
          echo "NEXT_PUBLIC_GEMINI_COMMENTARY_URL is set automatically in the Firebase build."
