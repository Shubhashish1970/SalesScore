# Deploy Gemini commentary API to GCP Cloud Functions (Gen2) on push to main.
#
# Uses same DEPLOY_TARGET variable as main deploy: staging → salesscore-c34f3, prod → salesscore-prod.
# Triggered when this file or gcp-gemini-api/** changes. Uses DEPLOY_TARGET for prod/staging.
# Secrets: FIREBASE_SERVICE_ACCOUNT_JSON, GEMINI_API_KEY.

name: Deploy Gemini API (GCP)
# Trigger: push to main (gcp-gemini-api/** or this file) or Run workflow

on:
  push:
    branches: [main]
    paths:
      - "gcp-gemini-api/**"
      - ".github/workflows/deploy-gemini-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve project from DEPLOY_TARGET
        id: project
        run: |
          TARGET="${{ vars.DEPLOY_TARGET || 'staging' }}"
          if [ "$TARGET" = "prod" ]; then
            echo "project_id=salesscore-prod" >> $GITHUB_OUTPUT
          else
            echo "project_id=salesscore-c34f3" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.project.outputs.project_id }}

      - name: Deploy Cloud Function (Gemini commentary)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY not set; function will return 503 until key is set in GCP Console."
          fi
          gcloud functions deploy gemini-commentary \
            --gen2 \
            --runtime=nodejs22 \
            --region=us-central1 \
            --source=./gcp-gemini-api \
            --entry-point=geminiCommentary \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "GEMINI_API_KEY=$GEMINI_API_KEY" \
            --project="$PROJECT_ID" \
            --quiet
          echo "Function URL: https://us-central1-${PROJECT_ID}.cloudfunctions.net/gemini-commentary"
          echo "NEXT_PUBLIC_GEMINI_COMMENTARY_URL is set automatically in the Firebase build."
