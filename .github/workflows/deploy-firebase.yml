# Deploy Sales Scorecard to Firebase Hosting and Functions on push to main.
#
# Required: FIREBASE_SERVICE_ACCOUNT_JSON = full contents of your Firebase/GCP service account
#   key JSON (Firebase Console → Project Settings → Service accounts → Generate new private key).
# Optional: FIREBASE_PROJECT_ID (default salesscore-c34f3).
# KPI_DATA_API_URL: upstream KPI API (e.g. https://...run.app/api/scorecard). When set, client uses
#   same-origin proxy /api/scorecard to avoid CORS; function proxies to upstream.
# RESEND_API_KEY: Resend API key for admin link emails (get from resend.com). Required for /admin/request.

name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_GEMINI_COMMENTARY_URL: https://us-central1-${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}.cloudfunctions.net/gemini-commentary
          NEXT_PUBLIC_KPI_DATA_API_URL: ${{ secrets.KPI_DATA_API_URL && 'https://salesscore-c34f3.web.app/api/scorecard' || '' }}
        run: npm run build

      - name: Authenticate to GCP (Firebase)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}

      - name: Deploy KPI proxy (Cloud Function via gcloud)
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}
          KPI_UPSTREAM: ${{ secrets.KPI_DATA_API_URL }}
        run: |
          gcloud functions deploy kpiProxy \
            --gen2 \
            --runtime=nodejs20 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=kpiProxy \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "KPI_API_UPSTREAM_URL=$KPI_UPSTREAM" \
            --project="$PROJECT_ID" \
            --quiet
          echo "KPI proxy: https://asia-south1-${PROJECT_ID}.cloudfunctions.net/kpiProxy"

      - name: Deploy Leaderboard proxy (Cloud Function via gcloud)
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}
          KPI_UPSTREAM: ${{ secrets.KPI_DATA_API_URL }}
        run: |
          gcloud functions deploy leaderboardProxy \
            --gen2 \
            --runtime=nodejs20 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=leaderboardProxy \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "KPI_API_UPSTREAM_URL=$KPI_UPSTREAM" \
            --project="$PROJECT_ID" \
            --quiet
          echo "Leaderboard proxy: https://asia-south1-${PROJECT_ID}.cloudfunctions.net/leaderboardProxy"

      - name: Deploy Admin link request (Cloud Function via gcloud)
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          gcloud functions deploy requestAdminLink \
            --gen2 \
            --runtime=nodejs20 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=requestAdminLink \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "RESEND_API_KEY=$RESEND_API_KEY" \
            --project="$PROJECT_ID" \
            --quiet
          echo "Admin link: https://asia-south1-${PROJECT_ID}.cloudfunctions.net/requestAdminLink"

      - name: Deploy HO mappings (Cloud Functions via gcloud)
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}
        run: |
          SA="${PROJECT_ID}@appspot.gserviceaccount.com"
          gcloud functions deploy getHoMappings \
            --gen2 \
            --runtime=nodejs20 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=getHoMappings \
            --trigger-http \
            --allow-unauthenticated \
            --service-account="$SA" \
            --project="$PROJECT_ID" \
            --quiet
          gcloud functions deploy saveHoMappings \
            --gen2 \
            --runtime=nodejs20 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=saveHoMappings \
            --trigger-http \
            --allow-unauthenticated \
            --service-account="$SA" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Deploy Firebase Hosting
        env:
          CI: true
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$PROJECT_ID"
