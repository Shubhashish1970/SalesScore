# Deploy Sales Scorecard to Firebase Hosting and Functions.
# main branch: manual deploy only (workflow_dispatch). stage branch: auto-deploy to staging on push.
#
# deploy_target: input (manual run) or vars.DEPLOY_TARGET.
#   stage → salesscore-c34f3, prod → salesscore-prod
# Required: FIREBASE_SERVICE_ACCOUNT_JSON = full contents of your Firebase/GCP service account
#   key JSON. Service account must have access to BOTH projects.
# KPI_DATA_API_URL: base URL only (no path), e.g. https://kw-sales-score-api-366769154420.asia-south1.run.app
#   Workflow appends /${api_env}/scorecard (api_env = stage|prod from DEPLOY_TARGET).
# RESEND_API_KEY: Resend API key for admin link emails. Required for /admin/request.

name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy target"
        required: true
        type: choice
        default: stage
        options:
          - stage
          - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve project from deploy_target
        id: project
        run: |
          TARGET="${{ github.event.inputs.deploy_target || vars.DEPLOY_TARGET || 'stage' }}"
          echo "api_env=$TARGET" >> $GITHUB_OUTPUT
          if [ "$TARGET" = "prod" ]; then
            echo "project_id=salesscore-prod" >> $GITHUB_OUTPUT
            echo "Deploying to PRODUCTION (salesscore-prod)"
          else
            echo "project_id=salesscore-c34f3" >> $GITHUB_OUTPUT
            echo "Deploying to STAGING (salesscore-c34f3)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          export NEXT_PUBLIC_GEMINI_COMMENTARY_URL="https://us-central1-${PROJECT_ID}.cloudfunctions.net/gemini-commentary"
          # Use relative URL so app always fetches from current origin (avoids build-env mismatch)
          export NEXT_PUBLIC_KPI_DATA_API_URL="/api/scorecard"
          npm run build

      - name: Authenticate to GCP (Firebase)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.project.outputs.project_id }}

      - name: Deploy KPI proxy (Cloud Function via gcloud)
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          KPI_BASE: ${{ secrets.KPI_DATA_API_URL }}
          API_ENV: ${{ steps.project.outputs.api_env }}
        run: |
          if echo "$KPI_BASE" | grep -qE '/(scorecard|stage|prod|api)(/|$)'; then
            echo "::error::KPI_DATA_API_URL must be base URL only (no path). Current value appears to include a path. Use e.g. https://kw-sales-score-api-366769154420.asia-south1.run.app"
            exit 1
          fi
          KPI_UPSTREAM="${KPI_BASE}/${API_ENV}/scorecard"
          echo "KPI upstream path: /${API_ENV}/scorecard"
          gcloud functions deploy kpiProxy \
            --gen2 \
            --runtime=nodejs22 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=kpiProxy \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "KPI_API_UPSTREAM_URL=$KPI_UPSTREAM" \
            --project="$PROJECT_ID" \
            --quiet
          echo "KPI proxy: https://asia-south1-${PROJECT_ID}.cloudfunctions.net/kpiProxy"

      - name: Deploy Leaderboard proxy (Cloud Function via gcloud)
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          KPI_BASE: ${{ secrets.KPI_DATA_API_URL }}
          API_ENV: ${{ steps.project.outputs.api_env }}
        run: |
          if echo "$KPI_BASE" | grep -qE '/(scorecard|stage|prod|api)(/|$)'; then
            echo "::error::KPI_DATA_API_URL must be base URL only (no path). Use e.g. https://kw-sales-score-api-366769154420.asia-south1.run.app"
            exit 1
          fi
          KPI_UPSTREAM="${KPI_BASE}/${API_ENV}/scorecard"
          gcloud functions deploy leaderboardProxy \
            --gen2 \
            --runtime=nodejs22 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=leaderboardProxy \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "KPI_API_UPSTREAM_URL=$KPI_UPSTREAM" \
            --project="$PROJECT_ID" \
            --quiet
          echo "Leaderboard proxy: https://asia-south1-${PROJECT_ID}.cloudfunctions.net/leaderboardProxy"

      - name: Deploy Admin link request (Cloud Function via gcloud)
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          APP_BASE_URL="https://${PROJECT_ID}.web.app"
          gcloud functions deploy requestAdminLink \
            --gen2 \
            --runtime=nodejs22 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=requestAdminLink \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "RESEND_API_KEY=$RESEND_API_KEY,APP_BASE_URL=$APP_BASE_URL" \
            --project="$PROJECT_ID" \
            --quiet
          echo "Admin link: https://asia-south1-${PROJECT_ID}.cloudfunctions.net/requestAdminLink"

      - name: Deploy HO mappings (Cloud Functions via gcloud)
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          SA="${PROJECT_ID}@appspot.gserviceaccount.com"
          gcloud functions deploy getHoMappings \
            --gen2 \
            --runtime=nodejs22 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=getHoMappings \
            --trigger-http \
            --allow-unauthenticated \
            --service-account="$SA" \
            --project="$PROJECT_ID" \
            --quiet
          gcloud functions deploy saveHoMappings \
            --gen2 \
            --runtime=nodejs22 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=saveHoMappings \
            --trigger-http \
            --allow-unauthenticated \
            --service-account="$SA" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Deploy Access config (Cloud Functions via gcloud)
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          SA="${PROJECT_ID}@appspot.gserviceaccount.com"
          gcloud functions deploy getAccessConfig \
            --gen2 \
            --runtime=nodejs22 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=getAccessConfig \
            --trigger-http \
            --allow-unauthenticated \
            --service-account="$SA" \
            --project="$PROJECT_ID" \
            --quiet
          gcloud functions deploy saveAccessConfig \
            --gen2 \
            --runtime=nodejs22 \
            --region=asia-south1 \
            --source=./functions \
            --entry-point=saveAccessConfig \
            --trigger-http \
            --allow-unauthenticated \
            --service-account="$SA" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Deploy Firebase Hosting
        env:
          CI: true
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          npm install -g firebase-tools
          echo "Deploying Hosting to project: $PROJECT_ID (from DEPLOY_TARGET)"
          firebase use "$PROJECT_ID"
          firebase deploy --only hosting --project "$PROJECT_ID"
          echo "Hosting URL: https://$PROJECT_ID.web.app"
