# Deploy Sales Scorecard to Firebase Hosting on push to main.
#
# Required: FIREBASE_SERVICE_ACCOUNT_JSON = full contents of your Firebase/GCP service account
#   key JSON (Firebase Console → Project Settings → Service accounts → Generate new private key).
# Optional: FIREBASE_PROJECT_ID (default salesscore-c34f3).

name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_GEMINI_COMMENTARY_URL: https://us-central1-${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}.cloudfunctions.net/gemini-commentary
          NEXT_PUBLIC_KPI_DATA_API_URL: ${{ secrets.KPI_DATA_API_URL || '' }}
        run: npm run build

      - name: Authenticate to GCP (Firebase)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy to Firebase Hosting
        env:
          CI: true
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'salesscore-c34f3' }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$PROJECT_ID"
